name: JSON-LD Lint

# Blocks on any invalid <script type="application/ld+json"> block (unparsable
# JSON, missing @context/@type). Added 2026-07-24 after Search Console
# flagged the same "https://***@type" corruption bug found on sipi.bot.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate-jsonld:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON-LD
        run: python3 scripts/validate_jsonld.py .
